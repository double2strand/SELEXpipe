# Conda environment for SELEXpipe.
# Python package floor matches envs/requirements.txt (biopython>=1.81).
# fastp, seqtk, gzip, and bc are not pip packages. fastp and seqtk were not
# version-pinned in the original scripts, so they are not pinned here either.
# spacek40 is shipped at scripts/02_motif/spacek40. It is not a conda package.
name: selexpipe
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  - biopython>=1.81
  - fastp
  - seqtk
  - bc
